name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag matching go/go.mod, optionally with -android.N
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths: ['go/**', 'rust/**', 'android/**', 'scripts/**', '.github/workflows/**']
  push:
    branches:
      - main
    paths: ['go/**', 'rust/**', 'android/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  go:
    uses: ./.github/workflows/go.yml

  rust:
    uses: ./.github/workflows/rust.yml

  release:
    needs: [go, rust]
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          core = re.search(r'github.com/metacubex/mihomo\s+(\S+)', pathlib.Path('go/go.mod').read_text()).group(1)
          if not re.fullmatch(re.escape(core) + r'(?:-android\.[1-9]\d*)?', os.environ['RELEASE_TAG']):
              raise SystemExit('Release tag must match the pinned core, optionally with -android.N')
          PY

      - name: Download Go artifacts
        uses: actions/download-artifact@v8
        with:
          name: libclash
          path: artifacts

      - name: Download Rust artifacts
        uses: actions/download-artifact@v8
        with:
          name: libclash-rs
          path: artifacts

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh auth setup-git
          git fetch origin --tags
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$RELEASE_TAG"
          fi
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish both AARs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(jq -r .isDraft release-state.json)" = false ]; then
              echo 'Release is already published; keeping existing assets.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            artifacts/libclash.aar artifacts/libclash-sources.jar \
            artifacts/libclash-rs.aar artifacts/libclash-rs-sources.jar --clobber
          gh release edit "$RELEASE_TAG" --draft=false
