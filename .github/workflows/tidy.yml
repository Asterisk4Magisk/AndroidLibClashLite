name: Check and Update Cores

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: core-stable-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test update planner
        run: python3 -m unittest discover -s scripts -p 'test_check_upstream.py'

      - name: Check both stable releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/check_upstream.py --repository "$GH_REPO" --plan "$RUNNER_TEMP/core-update.json" --output "$GITHUB_OUTPUT"

      - name: Setup Golang
        if: steps.check.outputs.go_update == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
          check-latest: true

      - name: Apply checked core updates
        if: steps.check.outputs.update == 'true'
        run: python3 scripts/check_upstream.py --apply --plan "$RUNNER_TEMP/core-update.json"

      - name: Setup Rust validation tools
        if: steps.check.outputs.rust_update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libclang-dev
          toolchain="$(python3 -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('rust/rust-toolchain.toml').read_text())['toolchain']['channel'])")"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt

      - name: Refresh Rust lockfile and validate update
        if: steps.check.outputs.rust_update == 'true'
        working-directory: rust
        run: |
          cargo check
          cargo fmt --all -- --check
          cargo test --locked

      - name: Commit and push changes
        if: steps.check.outputs.build == 'true'
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GO_TAG: ${{ steps.check.outputs.go_tag }}
          RUST_TAG: ${{ steps.check.outputs.rust_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$DEFAULT_BRANCH" --tags
          test "$(git rev-parse "origin/$DEFAULT_BRANCH")" = "$(git rev-parse HEAD)"
          git add go/go.mod go/go.sum rust/upstream.json rust/Cargo.toml rust/Cargo.lock rust/rust-toolchain.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update cores (Mihomo $GO_TAG, meow $RUST_TAG)"
          fi
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$RELEASE_TAG"
          fi
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$RELEASE_TAG"

      - name: Trigger build
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
        run: gh workflow run main.yml --ref "$RELEASE_TAG" --field "release_tag=$RELEASE_TAG"
